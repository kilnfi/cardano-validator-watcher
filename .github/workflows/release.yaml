name: Release

on:
  push:
    tags:
      - "*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_NAME: cardano-validator-watcher
  BINARY_NAME: cardano-validator-watcher
  CHART_NAME: cardano-validator-watcher
  CHART_DIRECTORY: charts
  REGISTRY: oci://ghcr.io/kilnfi/charts

jobs:
  approve:
    name: Approve release
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Release approved
        run: echo "Releasing ${GITHUB_REF_NAME}"

  binaries:
    name: binaries
    needs: approve
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            os_name: linux
            arch: amd64
          - runner: ubuntu-latest
            os_name: linux
            arch: arm64
          - runner: macos-latest
            os_name: darwin
            arch: amd64
          - runner: macos-latest
            os_name: darwin
            arch: arm64

    runs-on: ${{ matrix.runner }}

    env:
      ARCH_NAME: ${{ matrix.arch }}
      OS_NAME: ${{ matrix.os_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail

          if [ "$OS_NAME" = "linux" ]; then
            sudo apt-get update
            if [ "$ARCH_NAME" = "amd64" ]; then
              sudo apt-get install -y build-essential
            elif [ "$ARCH_NAME" = "arm64" ]; then
              sudo apt-get install -y build-essential gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            fi
          elif [ "$OS_NAME" = "darwin" ]; then
            brew update
            brew install sqlite
          fi

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          cache: false

      - name: Build ${{ matrix.os_name }}-${{ matrix.arch }} binary
        id: build
        shell: bash
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          OUTPUT_NAME="${BINARY_NAME}_${REF_NAME}_${OS_NAME}_${ARCH_NAME}"
          OUTPUT_DIR="dist/${OUTPUT_NAME}"
          ARCHIVE_NAME="${OUTPUT_NAME}.tar.gz"
          ARCHIVE_PATH="${OUTPUT_DIR}/${ARCHIVE_NAME}"

          echo "output_dir=${OUTPUT_DIR}" >> "$GITHUB_OUTPUT"
          echo "archive_path=${ARCHIVE_PATH}" >> "$GITHUB_OUTPUT"

          mkdir -p "${OUTPUT_DIR}"

          if [ "$OS_NAME" = "linux" ] && [ "$ARCH_NAME" = "arm64" ]; then
            export CC=aarch64-linux-gnu-gcc
            export CXX=aarch64-linux-gnu-g++
          fi

          CGO_ENABLED=1 GOOS="$OS_NAME" GOARCH="$ARCH_NAME" \
            go build -ldflags="-s -w" -o "${OUTPUT_DIR}/${BINARY_NAME}" cmd/watcher/main.go

          tar -czvf "${ARCHIVE_PATH}" -C "${OUTPUT_DIR}" "${BINARY_NAME}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.os_name }}-${{ matrix.arch }}
          path: ${{ steps.build.outputs.archive_path }}
          if-no-files-found: error
          retention-days: 1

  release_binaries:
    name: Upload binaries to GitHub Release
    needs: binaries
    runs-on: fixed-egress-4c-16g
    permissions:
      contents: write # upload release assets
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          pattern: binary-*
          merge-multiple: true

      - name: Show downloaded artifacts
        shell: bash
        run: |
          set -euo pipefail
          find dist -type f -name "*.tar.gz" -print

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@29e53e917877a24fad85510ded594ab3c9ca12de # v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: "dist/*.tar.gz"
          tag: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          file_glob: true
          overwrite: true
          # release candidates must not become "Latest" nor the base of the release notes draft
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          make_latest: ${{ !contains(github.ref_name, '-rc') }}

  images:
    name: images
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        # amd64 only: cardano-cli / cncli are downloaded for x86_64 and cncli has no linux arm64 release
        arch:
          - amd64
    runs-on: fixed-egress-4c-16g
    permissions:
      contents: read # checkout
      packages: write # push images to ghcr.io
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build & Push Container Images
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          labels: |-
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.name=${{ env.IMAGE_NAME }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.authors=contact@kiln.fi
          platforms: linux/${{ matrix.arch }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |-
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: digests-linux-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge
    runs-on: fixed-egress-4c-16g
    needs:
      - images
    permissions:
      packages: write # push images to ghcr.io
      id-token: write # needed for cosign keyless signing
    env:
      REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/cardano-validator-watcher
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Create manifest list and push
        working-directory: /tmp/digests
        shell: bash
        run: |
          set -euo pipefail
          TAGS="-t ${REGISTRY_IMAGE}:${REF_NAME}"
          if [[ "${REF_NAME}" != *"-rc"* ]]; then
            TAGS="${TAGS} -t ${REGISTRY_IMAGE}:latest"
          fi
          docker buildx imagetools create ${TAGS} \
            "${REGISTRY_IMAGE}:${REF_NAME}-amd64"

      - name: Inspect image
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${REF_NAME}" != *"-rc"* ]]; then
            docker buildx imagetools inspect "${REGISTRY_IMAGE}:latest"
          fi
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${REF_NAME}"

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1

      - name: Sign image with cosign (keyless)
        shell: bash
        run: |
          set -euo pipefail
          DIGEST="$(docker buildx imagetools inspect "${REGISTRY_IMAGE}:${REF_NAME}" --format '{{ .Manifest.Digest }}')"
          cosign sign --yes "${REGISTRY_IMAGE}@${DIGEST}"
